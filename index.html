<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <header>
        <span class="eyebrow">API HOMEWORK - POKEDEX LAB</span>
        <h1>Pokémon Card Explorer</h1>
        <p>Search the PokéAPI, Inspect the response, and turn structured data into a trending -card-style interface.</p>
    </header>
    <section>
        <span class="eyebrow">Live Search</span>
        <h2>Find a Pokemon</h2>
        <form id="form">
            <input id="input" placeholder="e.g pikachu" list="Pokemon-list">
            <button type="button" id="clear" class="clear">x</button>
            <button type="submit" class="search">Search↗</button>
            <datalist id="Pokemon-list"></datalist>
        </form>
        
        
        <div class="quick">
        <p>Quick Search:</p>
        <button type="button" class="quicksearch" data-name="Pikachu">Pikachu</button>
        <button type="button" class="quicksearch" data-name="Charizard">Charizard</button>
        <button tupe="button" class="quicksearch" data-name="bulbasaur">Bulbasaur</button>
        <button type="button" class="quicksearch" data-name="Mewtwo">Mewtwo</button>
        </div>
    </section>
    
    <p id="status">Type a name to begin</p>

    <section id="result">
        <div id="placeholder">
            <h2>Your next discovery is waiting...</h2>
        </div>
    </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
